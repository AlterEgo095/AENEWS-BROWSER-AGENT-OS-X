version: '3.8'

# ═══════════════════════════════════════════════════════════════════
# AENEWS Agent OS X — Docker Compose (Production-Ready)
# ═══════════════════════════════════════════════════════════════════
# Phase 6: DevOps & Performance Remediation
#   - Resource limits per service
#   - Restart policies (unless-stopped)
#   - Logging configuration (max-size, max-file)
#   - Network isolation (backend internal + frontend external)
#   - Named volumes with conventions
#   - Health check tuning (start_period, interval, timeout, retries)
# ═══════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aenews-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aenews}
      POSTGRES_USER: ${POSTGRES_USER:-aenews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - aenews_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aenews} -d ${POSTGRES_DB:-aenews}']
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - aenews-backend

  # ─── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aenews-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - aenews_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '30m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    networks:
      - aenews-backend

  # ─── RabbitMQ ──────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: aenews-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aenews}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-aenews}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_PORT:-15672}:15672'
    volumes:
      - aenews_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      start_period: 40s
      interval: 15s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - aenews-backend

  # ─── Neo4j ─────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: aenews-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_pagecache_size: 256M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - '${NEO4J_HTTP_PORT:-7474}:7474'
      - '${NEO4J_BOLT_PORT:-7687}:7687'
    volumes:
      - aenews_neo4j_data:/data
      - aenews_neo4j_logs:/logs
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:7474 || exit 1']
      start_period: 45s
      interval: 15s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      - aenews-backend

  # ─── Qdrant ────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: aenews-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - '${QDRANT_PORT:-6333}:6333'
      - '${QDRANT_GRPC_PORT:-6334}:6334'
    volumes:
      - aenews_qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:6333/healthz || exit 1']
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '30m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - aenews-backend

  # ─── MinIO ─────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: aenews-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - aenews_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '30m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    networks:
      - aenews-backend

  # ─── Application (Backend API) ──────────────────────────────
  # Uncomment when deploying with Docker Compose.
  # The app service waits for all infrastructure to be healthy before starting.
  #
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: aenews-app
  #   restart: unless-stopped
  #   ports:
  #     - '${APP_PORT:-3000}:3000'
  #   env_file:
  #     - .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #     neo4j:
  #       condition: service_healthy
  #     qdrant:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: '100m'
  #       max-file: '5'
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 2G
  #         cpus: '2.0'
  #       reservations:
  #         memory: 512M
  #         cpus: '0.5'
  #   networks:
  #     - aenews-frontend
  #     - aenews-backend
  #
  # ─── Nginx Reverse Proxy ──────────────────────────────────────
  # nginx:
  #   image: nginx:1.25-alpine
  #   container_name: aenews-nginx
  #   restart: unless-stopped
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   volumes:
  #     - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./docker/nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: '50m'
  #       max-file: '5'
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M
  #         cpus: '0.5'
  #       reservations:
  #         memory: 64M
  #         cpus: '0.1'
  #   networks:
  #     - aenews-frontend

volumes:
  aenews_postgres_data:
    driver: local
    name: aenews-postgres-data
  aenews_redis_data:
    driver: local
    name: aenews-redis-data
  aenews_rabbitmq_data:
    driver: local
    name: aenews-rabbitmq-data
  aenews_neo4j_data:
    driver: local
    name: aenews-neo4j-data
  aenews_neo4j_logs:
    driver: local
    name: aenews-neo4j-logs
  aenews_qdrant_data:
    driver: local
    name: aenews-qdrant-data
  aenews_minio_data:
    driver: local
    name: aenews-minio-data

networks:
  # External-facing network — only app and nginx should be here
  aenews-frontend:
    driver: bridge
    name: aenews-frontend
  # Internal-only network — all backend services communicate here
  aenews-backend:
    driver: bridge
    name: aenews-backend
    internal: true
