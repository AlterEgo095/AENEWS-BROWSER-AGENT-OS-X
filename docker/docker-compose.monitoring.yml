version: '3.8'

# ─── AENEWS Agent OS X — Monitoring Stack ──────────────────────
# Run with: docker compose -f docker-compose.monitoring.yml up -d
# This stack is separate from dev/prod compose files.
# ────────────────────────────────────────────────────────────────

services:
  # ─── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aenews-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - aenews-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ─── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.1
    container_name: aenews-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aenews-overview.json
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3001}"
      GF_LOG_LEVEL: ${GRAFANA_LOG_LEVEL:-info}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/dashboard-providers:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - aenews-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ─── Jaeger (Distributed Tracing) ──────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: aenews-jaeger
    ports:
      - "${JAEGER_OTLP_PORT:-4318}:4318"     # OTLP HTTP
      - "${JAEGER_GRPC_PORT:-4317}:4317"     # OTLP gRPC
      - "${JAEGER_UI_PORT:-16686}:16686"     # Jaeger UI
      - "${JAEGER_ZIPKIN_PORT:-9411}:9411"   # Zipkin compatible
    environment:
      COLLECTOR_OTLP_ENABLED: true
      LOG_LEVEL: ${JAEGER_LOG_LEVEL:-info}
    networks:
      - aenews-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  aenews-network:
    driver: bridge
    name: aenews-network
