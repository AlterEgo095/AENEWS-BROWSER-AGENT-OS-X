# ─── AENEWS Agent OS X — Grafana Dashboard Provider ──────────
# Auto-loads all JSON dashboards from the dashboards directory.
# ────────────────────────────────────────────────────────────────

apiVersion: 1

providers:
  - name: 'AENEWS Dashboards'
    orgId: 1
    folder: 'AENEWS Agent OS X'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
