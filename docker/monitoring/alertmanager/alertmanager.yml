# ═══════════════════════════════════════════════════════════════
# AENEWS Agent OS X — Alertmanager Configuration
# ═══════════════════════════════════════════════════════════════
# Routes security alerts to appropriate channels:
#   - Critical → Slack #security-alerts + PagerDuty
#   - Warning  → Slack #security-alerts
#   - Info     → Slack #monitoring
# ═══════════════════════════════════════════════════════════════

global:
  resolve_timeout: 5m
  # Slack webhook (configure via environment variable)
  slack_api_url: '{{ .Env.SLACK_WEBHOOK_URL }}'

# Default route
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-security'

  # Child routes
  routes:
    # Critical alerts → Slack + PagerDuty
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    # Authentication-specific alerts
    - match:
        team: security
      receiver: 'slack-security'
      group_wait: 30s

    # Platform/circuit breaker alerts
    - match:
        team: platform
      receiver: 'slack-platform'

# Inhibition rules (suppress lower-severity when higher is firing)
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']

  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster']

# Receivers
receivers:
  # Critical alerts — multi-channel
  - name: 'critical-alerts'
    slack_configs:
      - channel: '#security-alerts'
        title: ':rotating_light: CRITICAL: {{ .GroupLabels.alertname }}'
        text: |-
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* CRITICAL
          *Cluster:* {{ .GroupLabels.cluster }}

          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

          :warning: *Immediate action required!*
        send_resolved: true
        color: 'danger'

    # PagerDuty integration (uncomment when configured)
    # pagerduty_configs:
    #   - service_key: '{{ .Env.PAGERDUTY_SERVICE_KEY }}'
    #     severity: critical

  # Security team Slack channel
  - name: 'slack-security'
    slack_configs:
      - channel: '#security-alerts'
        title: ':shield: {{ .GroupLabels.alertname }}'
        text: |-
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          *Cluster:* {{ .GroupLabels.cluster }}

          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
        send_resolved: true

  # Platform team Slack channel
  - name: 'slack-platform'
    slack_configs:
      - channel: '#platform-alerts'
        title: ':wrench: {{ .GroupLabels.alertname }}'
        text: |-
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}

          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
