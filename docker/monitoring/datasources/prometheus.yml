# ─── AENEWS Agent OS X — Grafana Datasource Auto-Provisioning ─
# Automatically configures Prometheus and Loki as datasources.
# Phase 6: Added Loki for log aggregation queries.
# ────────────────────────────────────────────────────────────────

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus-aenews
    url: http://aenews-prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '10s'
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: '2.51.0'

  - name: Loki
    type: loki
    access: proxy
    uid: loki-aenews
    url: http://aenews-loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: 'jaeger-aenews'
          matcherRegex: 'trace_id=(\\w+)'
          name: 'TraceID'
          url: '$${__value.raw}'

  - name: Jaeger
    type: jaeger
    access: proxy
    uid: jaeger-aenews
    url: http://aenews-jaeger:16686
    editable: true
    jsonData:
      tracesToMetrics:
        - datasourceUid: 'prometheus-aenews'
          tags:
            - key: 'service'
              value: 'service'
