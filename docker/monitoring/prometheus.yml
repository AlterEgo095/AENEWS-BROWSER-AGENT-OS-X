# ═══════════════════════════════════════════════════════════════
# AENEWS Agent OS X — Prometheus Configuration (Phase 6)
# ═══════════════════════════════════════════════════════════════
# Enhanced with full scrape coverage, recording rules,
# and alerting rule files.
# ═══════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'aenews-agent-osx'
    environment: 'production'

# Alertmanager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      timeout: 10s
      api_version: v2

# Load alerting rules
rule_files:
  - 'alert_rules/*.yml'

# Scrape configurations
scrape_configs:
  # ─── Backend API ──────────────────────────────────────────
  - job_name: 'aenews-api'
    metrics_path: '/api/v1/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['api:3000']
        labels:
          service: 'api'
          team: 'platform'

  # ─── Prometheus Self-Monitoring ───────────────────────────
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          team: 'platform'

  # ─── Alertmanager ─────────────────────────────────────────
  - job_name: 'alertmanager'
    scrape_interval: 15s
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
          team: 'platform'

  # ─── Grafana ──────────────────────────────────────────────
  - job_name: 'grafana'
    scrape_interval: 30s
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          team: 'platform'

  # ─── Loki ─────────────────────────────────────────────────
  - job_name: 'loki'
    scrape_interval: 30s
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'
          team: 'platform'

  # ─── Node Exporter (System Metrics) ───────────────────────
  # NOTE: node-exporter service is not yet defined in docker-compose.
  # Uncomment the following once you add it to your compose stack:
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node'

  # ─── PostgreSQL Exporter ──────────────────────────────────
  # NOTE: postgres-exporter service is not yet defined in docker-compose.
  # Uncomment the following once you add it to your compose stack:
  # - job_name: 'postgres-exporter'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgresql'

  # ─── Redis Exporter ───────────────────────────────────────
  # NOTE: redis-exporter service is not yet defined in docker-compose.
  # Uncomment the following once you add it to your compose stack:
  # - job_name: 'redis-exporter'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         service: 'redis'

  # ─── Nginx Exporter ───────────────────────────────────────
  # NOTE: nginx-exporter service is not yet defined in docker-compose.
  # Uncomment the following once you add it to your compose stack:
  # - job_name: 'nginx-exporter'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']
  #       labels:
  #         service: 'nginx'

  # ─── OTLP Collector ───────────────────────────────────────
  # NOTE: otel-collector service is not yet defined in docker-compose.
  # Uncomment the following once you add it to your compose stack:
  # - job_name: 'otel-collector'
  #   scrape_interval: 30s
  #   static_configs:
  #     - targets: ['otel-collector:8889']
  #       labels:
  #         service: 'telemetry'

# Storage configuration
storage:
  tsdb:
    retention:
      time: 30d
      size: 10GB
