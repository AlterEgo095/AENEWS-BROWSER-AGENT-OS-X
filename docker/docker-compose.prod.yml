version: '3.8'

# ═══════════════════════════════════════════════════════════════════════
# AENEWS Agent OS X — Production Docker Compose
# ───────────────────────────────────────────────────────────────────────
# Complete production stack with Nginx reverse proxy, SSL termination,
# Let's Encrypt certbot, API backend, Next.js frontend, and all
# infrastructure services.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Initial SSL cert (before nginx has certs):
#   docker compose -f docker-compose.prod.yml run --rm certbot certonly \
#     --webroot --webroot-path /var/www/certbot \
#     -d yourdomain.com -d www.yourdomain.com
#
# Renew certs:
#   docker compose -f docker-compose.prod.yml run --rm certbot renew
# ═══════════════════════════════════════════════════════════════════════

services:
  # ─── Nginx Reverse Proxy + SSL Termination ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: aenews-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - aenews-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M
          cpus: '0.25'

  # ─── Certbot (Let's Encrypt) ──────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: aenews-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - aenews-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
          cpus: '0.1'

  # ─── AENEWS Agent OS X API ───────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aenews-api
    env_file:
      - ../../backend/.env
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aenews_osx}
      DB_USER: ${POSTGRES_USER:-aenews}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aenews_secret_2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-aenews_redis_2024}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aenews_neo4j_2024}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-aenews}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-aenews_rabbit_2024}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-aenews}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-aenews_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-aenews_minio_secret_2024}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
    # No host port exposure — only accessible via nginx on aenews-network
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - aenews-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ─── Frontend (Next.js Standalone) ───────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: aenews-frontend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    # No host port exposure — only accessible via nginx on aenews-network
    expose:
      - "3001"
    networks:
      - aenews-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ─── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aenews-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aenews_osx}
      POSTGRES_USER: ${POSTGRES_USER:-aenews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aenews_secret_2024}
    # Production: no host port exposure — only accessible on aenews-network
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aenews-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aenews} -d ${POSTGRES_DB:-aenews_osx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '2.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ─── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aenews-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-aenews_redis_2024}
    # Production: no host port exposure — only accessible on aenews-network
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - aenews-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aenews_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ─── Neo4j ────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: aenews-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aenews_neo4j_2024}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    # Production: no host port exposure — only accessible on aenews-network
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - aenews-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ─── Qdrant ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: aenews-qdrant
    # Production: no host port exposure — only accessible on aenews-network
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aenews-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ─── RabbitMQ ────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: aenews-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aenews}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aenews_rabbit_2024}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-aenews}
    # Production: no host port exposure — only accessible on aenews-network
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - aenews-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ─── MinIO ───────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: aenews-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-aenews_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-aenews_minio_secret_2024}
    command: server /data --console-address ":9001"
    # Production: no host port exposure — only accessible on aenews-network
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - aenews-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

# ═══════════════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  qdrant_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  # SSL / Let's Encrypt persistence
  certbot_www:
    driver: local
  certbot_certs:
    driver: local
  # Nginx logs persistence
  nginx_logs:
    driver: local

# ═══════════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════════
networks:
  aenews-network:
    driver: bridge
    name: aenews-network
