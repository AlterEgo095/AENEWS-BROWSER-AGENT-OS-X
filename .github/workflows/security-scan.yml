# ═══════════════════════════════════════════════════════════════
# AENEWS Agent OS X — Security Scanning Pipeline
# ═══════════════════════════════════════════════════════════════
# Comprehensive security scanning on every push and PR:
#   1. npm audit (dependency vulnerabilities)
#   2. Trivy container scanning
#   3. Gitleaks (secret detection)
#   4. Semgrep (SAST)
#   5. OWASP dependency check
#   6. License compliance
# ═══════════════════════════════════════════════════════════════

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

# ───────────────────────────────────────────────────────────────
jobs:
  # ─── Dependency Vulnerability Scan ──────────────────────────
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (production dependencies only)
        run: |
          echo "## 📦 NPM Audit Results (Production)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm audit --production --audit-level=moderate --json > audit-prod.json 2>/dev/null || true
          npm audit --production --audit-level=moderate 2>&1 | tee audit-prod-output.txt || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit-prod-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for critical/high vulnerabilities
        run: |
          CRITICAL=$(cat audit-prod.json | jq '[.vulnerabilities[] | select(.severity == "critical" or .severity == "high")] | length' 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Found $CRITICAL critical/high vulnerabilities in production dependencies"
            exit 1
          fi
          echo "✅ No critical/high vulnerabilities found in production dependencies"

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: backend/audit-prod.json
          retention-days: 30

  # ─── Secret Detection ──────────────────────────────────────
  secret-detection:
    name: Gitleaks Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Gitleaks Summary
        if: always()
        run: |
          echo "## 🔑 Secret Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Gitleaks scan completed. Check the results above for any leaked secrets." >> $GITHUB_STEP_SUMMARY

  # ─── SAST (Static Analysis) ────────────────────────────────
  sast-scan:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/typescript
            p/nestjs
          generateSarif: "1"
          auditOn: "push"

      - name: Semgrep Summary
        if: always()
        run: |
          echo "## 🔍 SAST Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Semgrep scan completed. Check the Semgrep dashboard for detailed findings." >> $GITHUB_STEP_SUMMARY

  # ─── Container Security Scan ───────────────────────────────
  container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: aenews-agent-osx:security-scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aenews-agent-osx:security-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail the pipeline, just report

      - name: Run Trivy filesystem scan (code)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Trivy Summary
        if: always()
        run: |
          echo "## 🐳 Container Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trivy scan completed. See SARIF results for details." >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 30

  # ─── License Compliance ─────────────────────────────────────
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: |
          npx license-checker --summary --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense;WTFPL" --excludePrivatePackages 2>&1 | tee license-output.txt || true
          echo "## 📋 License Compliance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat license-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  # ─── OWASP Dependency Check ────────────────────────────────
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run better-npm-audit
        run: |
          npx better-npm-audit audit --level=high || true
        continue-on-error: true

      - name: Security Summary
        if: always()
        run: |
          echo "## 🛡️ OWASP Dependency Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dependency check completed. Review findings above." >> $GITHUB_STEP_SUMMARY

  # ─── Security Gate ─────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [npm-audit, secret-detection, sast-scan, container-scan]
    if: always()

    steps:
      - name: Check security scan results
        run: |
          echo "## 🚨 Security Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | ${{ needs.secret-detection.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Scan | ${{ needs.sast-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fail if any critical scan failed
          if [ "${{ needs.npm-audit.result }}" = "failure" ] || \
             [ "${{ needs.secret-detection.result }}" = "failure" ] || \
             [ "${{ needs.sast-scan.result }}" = "failure" ]; then
            echo "❌ Security gate FAILED — critical issues detected"
            exit 1
          fi

          echo "✅ Security gate PASSED"
