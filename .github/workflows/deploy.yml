# ═══════════════════════════════════════════════════════════════
# AENEWS Agent OS X — Production Deployment Pipeline
# ═══════════════════════════════════════════════════════════════
# Triggers:
#   1. Push to main branch → auto-deploy to production
#   2. Manual workflow_dispatch → choose staging or production
#
# Flow:  test → build-and-push → deploy (SSH to VPS)
# ═══════════════════════════════════════════════════════════════

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  NODE_VERSION: 20
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ───────────────────────────────────────────────────────────────
jobs:
  # ─── Run Tests First ───────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aenews_test
          POSTGRES_USER: aenews
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aenews -d aenews_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: aenews_test
      DB_USER: aenews
      DB_PASSWORD: test_password
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --forceExit

  # ─── Build & Push Docker Image ─────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: success()

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_full: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/aenews-agent-osx
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.environment || 'production' }},enable=true
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Generate build summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ github.event.inputs.environment || 'production' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Built by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy to VPS via SSH ─────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: success()

    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ vars.DEPLOY_URL || 'https://aenews.ai' }}

    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
      COMPOSE_FILE: docker/docker-compose.prod.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "═══════════════════════════════════════════════"
            echo "  AENEWS Agent OS X — Deployment"
            echo "  Environment : ${{ env.DEPLOY_ENV }}"
            echo "  Commit      : ${{ github.sha }}"
            echo "  Triggered by: @${{ github.actor }}"
            echo "  Timestamp   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "═══════════════════════════════════════════════"

            # Navigate to project directory
            cd ~/aenews-agent-osx || {
              echo "❌ Project directory not found at ~/aenews-agent-osx"
              exit 1
            }

            # Pull latest code
            echo "📥 Pulling latest code from ${{ github.ref_name }}..."
            git fetch origin
            git checkout ${{ github.sha }}
            git pull origin ${{ github.ref_name }}

            # Log in to Docker Hub to access private images
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull the latest images
            echo "📦 Pulling Docker images..."
            docker-compose -f ${{ env.COMPOSE_FILE }} pull

            # Stop old containers and start new ones
            echo "🔄 Restarting services..."
            docker-compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans

            # Wait for services to stabilize
            echo "⏳ Waiting for services to stabilize..."
            sleep 15

            # Verify containers are running
            echo "✅ Verifying deployment..."
            docker-compose -f ${{ env.COMPOSE_FILE }} ps

            # Health check the API
            echo "🏥 Running health check..."
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:3000/api/v1/health > /dev/null 2>&1; then
                echo "✅ Health check passed (attempt $i)"
                break
              fi
              if [ "$i" -eq 5 ]; then
                echo "⚠️  Health check did not pass after 5 attempts"
                docker-compose -f ${{ env.COMPOSE_FILE }} logs --tail=50 api
              fi
              echo "   Retrying in 10s... (attempt $i/5)"
              sleep 10
            done

            # Clean up old images
            echo "🧹 Cleaning up unused Docker resources..."
            docker image prune -af --filter "until=168h" 2>/dev/null || true

            echo "═══════════════════════════════════════════════"
            echo "  ✅ Deployment completed successfully!"
            echo "═══════════════════════════════════════════════"

      - name: Generate deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ env.DEPLOY_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image tag** | \`${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| **VPS Host** | \`${{ secrets.VPS_HOST }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup SSH key
        if: always()
        run: rm -rf ~/.ssh/deploy_key

  # ─── Post-Deploy Notification ──────────────────────────────
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deployment of ${{ github.sha }} to ${{ github.event.inputs.environment || 'production' }} completed successfully"
          else
            echo "❌ Deployment of ${{ github.sha }} to ${{ github.event.inputs.environment || 'production' }} FAILED"
            exit 1
          fi
